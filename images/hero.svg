  <!-- Scaffold -->
  <g stroke="#475569" stroke-width="8" stroke-linecap="round">
    <line x1="470" y1="300" x2="470" y2="730"/>
    <line x1="1130" y1="300" x2="1130" y2="730"/>
    <line x1="470" y1="360" x2="1130" y2="360"/>
    <line x1="470" y1="540" x2="1130" y2="540"/>
  </g>

  <!-- Brick pile -->
  <g>
    <rect x="1170" y="650" width="120" height="22" fill="url(#brick)" stroke="#7c3a1d" stroke-width="2"/>
    <rect x="1170" y="672" width="120" height="22" fill="url(#brick)" stroke="#7c3a1d" stroke-width="2"/>
    <rect x="1170" y="694" width="120" height="22" fill="url(#brick)" stroke="#7c3a1d" stroke-width="2"/>
  </g>

  <!-- Bricklayer -->
  <g>
    <circle cx="800" cy="280" r="24" fill="#1f2937"/>
    <rect x="780" y="302" width="40" height="56" rx="12" fill="#b45309"/>
    <rect x="784" y="356" width="14" height="40" rx="7" fill="#1f2937"/>
    <rect x="802" y="356" width="14" height="40" rx="7" fill="#1f2937"/>
    <line x1="816" y1="320" x2="880" y2="300" stroke="#b45309" stroke-width="14" stroke-linecap="round"/>
    <g transform="rotate(-30 880 300)">
      <rect x="878" y="286" width="40" height="28" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>
      <rect x="884" y="312" width="10" height="18" fill="#64748b"/>
