<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="0.55" stop-color="#e0ecff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2703a"/>
      <stop offset="1" stop-color="#9a4e1f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1330" cy="170" r="90" fill="#fde047" opacity="0.9"/>
  <circle cx="1330" cy="170" r="120" fill="#fef08a" opacity="0.35"/>

  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="300" cy="150" rx="90" ry="34"/>
    <ellipse cx="370" cy="135" rx="70" ry="30"/>
    <ellipse cx="240" cy="135" rx="60" ry="26"/>
    <ellipse cx="900" cy="100" rx="80" ry="30"/>
    <ellipse cx="960" cy="88" rx="60" ry="24"/>
  </g>

  <rect y="720" width="1600" height="180" fill="#dcfce7"/>
  <rect y="720" width="1600" height="14" fill="#bbf7d0"/>

  <!-- Brick wall -->
  <g>
    <rect x="500" y="340" width="600" height="380" fill="url(#brick)"/>
