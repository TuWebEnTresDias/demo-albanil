      <line x1="500" y1="420" x2="1100" y2="420"/>
      <line x1="500" y1="460" x2="1100" y2="460"/>
      <line x1="500" y1="500" x2="1100" y2="500"/>
      <line x1="500" y1="540" x2="1100" y2="540"/>
      <line x1="500" y1="580" x2="1100" y2="580"/>
      <line x1="500" y1="620" x2="1100" y2="620"/>
      <line x1="500" y1="660" x2="1100" y2="660"/>
      <line x1="500" y1="700" x2="1100" y2="700"/>
    </g>
    <g stroke="#7c3a1d" stroke-width="3" opacity="0.4">
      <line x1="590" y1="340" x2="590" y2="380"/><line x1="680" y1="340" x2="680" y2="380"/><line x1="770" y1="340" x2="770" y2="380"/><line x1="860" y1="340" x2="860" y2="380"/><line x1="950" y1="340" x2="950" y2="380"/><line x1="1040" y1="340" x2="1040" y2="380"/>
      <line x1="545" y1="380" x2="545" y2="420"/><line x1="635" y1="380" x2="635" y2="420"/><line x1="725" y1="380" x2="725" y2="420"/><line x1="815" y1="380" x2="815" y2="420"/><line x1="905" y1="380" x2="905" y2="420"/><line x1="995" y1="380" x2="995" y2="420"/>
      <line x1="590" y1="420" x2="590" y2="460"/><line x1="680" y1="420" x2="680" y2="460"/><line x1="770" y1="420" x2="770" y2="460"/><line x1="860" y1="420" x2="860" y2="460"/><line x1="950" y1="420" x2="950" y2="460"/><line x1="1040" y1="420" x2="1040" y2="460"/>
      <line x1="545" y1="460" x2="545" y2="500"/><line x1="635" y1="460" x2="635" y2="500"/><line x1="725" y1="460" x2="725" y2="500"/><line x1="815" y1="460" x2="815" y2="500"/><line x1="905" y1="460" x2="905" y2="500"/><line x1="995" y1="460" x2="995" y2="500"/>
